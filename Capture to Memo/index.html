<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta name="theme-color" content="#f9fbff" />
    <title>Capture to Memo — Acrylic Album</title>
    <style>
      /* ============================================================
   CAPTURE TO MEMO  /  ACRYLIC ALBUM EDITION
   A single, consolidated stylesheet. No pins; no old overrides.
   ============================================================ */
      :root {
        --ink: #192444;
        --muted: #74819e;
        --blue: #4459ed;
        --line: rgba(112, 140, 195, 0.19);
        --white: #fff;
        --bg: #fafcff;
        --visual-height: 100dvh;
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        width: 100%;
        height: 100%;
        font-family:
          Inter, Pretendard, Arial, "Apple SD Gothic Neo", sans-serif;
        color: var(--ink);
      }
      body {
        overflow: hidden;
        background: var(--bg);
      }
      button,
      input,
      select,
      textarea {
        font: inherit;
      }
      button {
        cursor: pointer;
      }
      button:disabled {
        opacity: 0.5;
        cursor: not-allowed;
      }
      button:focus-visible,
      input:focus-visible,
      .rich-editor:focus-visible {
        outline: 2px solid #4b65ec;
        outline-offset: 2px;
      }
      [hidden] {
        display: none !important;
      }
      .micro {
        font-size: 11px;
        font-weight: 800;
        letter-spacing: 0.18em;
      }
      /* ------------------------------------------------------------
   01. CONTINUOUS COVER + DARKROOM WORLD
   ------------------------------------------------------------ */
      #world {
        position: relative;
        z-index: 0;
        width: 100vw;
        height: 100dvh;
        overflow-x: auto;
        overflow-y: hidden;
        scroll-snap-type: none;
        touch-action: pan-x pan-y;
        overscroll-behavior-x: contain;
        scrollbar-width: none;
        -webkit-overflow-scrolling: touch;
      }
      #world::-webkit-scrollbar {
        display: none;
      }
      #world-track {
        position: relative;
        display: flex;
        width: 200vw;
        height: 100%;
        transform: none !important;
        transition: none !important;
        background:
          radial-gradient(
            ellipse 31% 47% at 45% 54%,
            rgba(112, 159, 255, 0.14),
            transparent 70%
          ),
          radial-gradient(
            ellipse 26% 65% at 88% 29%,
            rgba(144, 192, 245, 0.12),
            transparent 70%
          ),
          linear-gradient(110deg, #fff 0%, #fafbff 42%, #f1f6fc 100%);
      }
      #world-track::before {
        content: "";
        position: absolute;
        inset: 0;
        pointer-events: none;
        opacity: 0.52;
        background: repeating-linear-gradient(
          90deg,
          rgba(71, 100, 158, 0.1) 0 1px,
          transparent 1px calc(20vw)
        );
      }
      .world-page {
        position: relative;
        flex: 0 0 100vw;
        min-width: 0;
        height: 100%;
        background: transparent;
        overflow: hidden;
        scroll-snap-align: none;
      }
      /* Cover */
      #cover .brand-mark {
        position: absolute;
        left: 4.2%;
        top: 5%;
        z-index: 9;
        display: flex;
        align-items: center;
        gap: 11px;
        white-space: nowrap;
      }
      .brand-bubble {
        width: 23px;
        height: 23px;
        border: 6px solid var(--blue);
        border-radius: 50%;
        display: inline-block;
      }
      #cover .quiet-right {
        position: absolute;
        right: 4%;
        top: 6.8%;
        z-index: 5;
        color: #848da7;
        white-space: nowrap;
      }
      .floating-scene {
        position: absolute;
        inset: 0;
        z-index: 1;
        pointer-events: none;
      }
      #three-glass-scene {
        position: absolute;
        inset: 0 0 0 27%;
        pointer-events: none;
      }
      #three-glass-scene canvas {
        width: 100%;
        height: 100%;
        display: block;
        pointer-events: none;
      }
      #cover-title {
        position: absolute;
        top: 26%;
        left: 6.3%;
        z-index: 5;
        width: 48%;
        max-width: 820px;
        pointer-events: none;
      }
      .eyebrow {
        display: flex;
        align-items: center;
        gap: 14px;
        color: var(--blue);
      }
      .eyebrow::before {
        content: "";
        width: 42px;
        height: 2px;
        background: var(--blue);
      }
      #cover-title h1 {
        font-size: clamp(64px, 8.6vw, 162px);
        line-height: 0.91;
        letter-spacing: -0.083em;
        font-weight: 850;
        margin: 24px 0 32px;
      }
      #cover-title h1 span {
        color: var(--blue);
      }
      #cover-title p {
        font-size: clamp(13px, 1.3vw, 20px);
        line-height: 1.75;
        color: #8390a8;
        font-weight: 440;
        letter-spacing: -0.02em;
      }
      .cover-controls {
        position: absolute;
        left: 6.3%;
        bottom: 11.2%;
        z-index: 12;
        display: flex;
        flex-wrap: wrap;
        gap: 12px;
        align-items: center;
      }
      .pill {
        border: 1px solid #dbe2f1;
        border-radius: 100px;
        white-space: nowrap;
        padding: 14px 24px;
        background: rgba(255, 255, 255, 0.87);
        font-weight: 750;
        font-size: 14px;
        color: #1b2747;
        box-shadow: 0 9px 24px rgba(36, 60, 125, 0.07);
      }
      .pill.primary {
        color: white;
        background: var(--blue);
        border-color: var(--blue);
      }
      .pill:hover {
        filter: brightness(0.97);
      }
      /* 3 real photographs: translucent acrylic polaroids. NO pins. */
      #cover-photo-floats {
        position: absolute;
        inset: 0;
        z-index: 8;
        pointer-events: none;
      }
      .cover-float-card {
        position: absolute;
        display: block;
        width: clamp(126px, 11.6vw, 184px);
        height: auto;
        aspect-ratio: 170/206;
        padding: 10px 10px 30px;
        border: 1px solid rgba(255, 255, 255, 0.9);
        border-radius: 11px;
        overflow: visible;
        isolation: isolate;
        background: linear-gradient(
          132deg,
          rgba(255, 255, 255, 0.79),
          rgba(226, 240, 255, 0.49) 63%,
          rgba(216, 229, 255, 0.65)
        );
        -webkit-backdrop-filter: blur(18px) saturate(1.35);
        backdrop-filter: blur(18px) saturate(1.35);
        box-shadow:
          inset 2px 2px 2px rgba(255, 255, 255, 0.94),
          inset -2px -3px 12px rgba(80, 131, 224, 0.08),
          0 14px 33px rgba(38, 67, 127, 0.16);
        text-align: left;
        pointer-events: auto;
        cursor: pointer;
        transform-style: preserve-3d;
        animation: ctmFloat 7s ease-in-out infinite alternate;
        translate: 0 0;
      }
      .cover-float-card::before {
        content: "";
        position: absolute;
        inset: 2px;
        border: 1px solid rgba(255, 255, 255, 0.44);
        border-radius: 9px;
        pointer-events: none;
      }
      .cover-float-card img {
        display: block;
        width: 100%;
        height: 100%;
        object-fit: contain;
        object-position: center;
        background: #e7eef9;
        border-radius: 3px;
        pointer-events: none;
      }
      .cover-float-label {
        position: absolute;
        bottom: 8px;
        left: 10px;
        right: 10px;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
        color: #647390;
        font-size: 10px;
        font-weight: 800;
        pointer-events: none;
      }
      .cover-float-card:nth-child(1) {
        --floatY: 12px;
        animation-duration: 7.5s;
        animation-delay: -1.5s;
      }
      .cover-float-card:nth-child(2) {
        --floatY: 18px;
        animation-duration: 8.8s;
        animation-delay: -3.4s;
      }
      .cover-float-card:nth-child(3) {
        --floatY: 15px;
        animation-duration: 6.9s;
        animation-delay: -2.7s;
      }
      @keyframes ctmFloat {
        from {
          translate: 0 0;
        }
        to {
          translate: 4px calc(-1 * var(--floatY, 12px));
        }
      }
      /* ------------------------------------------------------------
   //THE PRINT ROOM — TWO CROSSING WIRES + PHYSICS POLAROIDS
   //앞줄: Firebase 실제 사진 | 뒷줄: 흐린 빈 폴라로이드
   ------------------------------------------------------------ */
      #world-wire-overlay {
        position: absolute;
        inset: 0;
        z-index: 1;
        width: 100%;
        height: 100%;
        pointer-events: none;
        overflow: visible;
      }
      #world-wire-overlay line {
        vector-effect: non-scaling-stroke;
        stroke-linecap: round;
        stroke-width: 1.6;
      }
      #front-wire {
        stroke: rgba(84, 113, 177, 0.48);
      }
      #rear-wire {
        stroke: rgba(124, 158, 194, 0.24);
        stroke-width: 1.2;
        filter: blur(0.5px);
      }
      .world-page {
        z-index: 2;
      }
      #darkroom {
        display: block;
        overflow: visible;
      }
      #darkroom-scene {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        overflow: visible;
        isolation: isolate;
        pointer-events: none;
      }
      #darkroom-scene::before {
        content: "";
        position: absolute;
        inset: 0;
        pointer-events: none;
        background: radial-gradient(
          ellipse at 65% 45%,
          rgba(131, 173, 255, 0.075),
          transparent 69%
        );
      }
      #rear-deco-layer,
      #front-photo-layer {
        position: absolute;
        inset: 0;
        overflow: visible;
        pointer-events: none;
      }
      #rear-deco-layer {
        z-index: 1;
        opacity: 0.55;
        filter: blur(1.35px);
      }
      #front-photo-layer {
        z-index: 3;
      }
      /* Real photos move with the wire; the parent never blocks scrolling. */
      .hanging-polaroid {
        position: absolute;
        display: block;
        width: clamp(112px, 10.8vw, 169px);
        aspect-ratio: 170/206;
        padding: 9px 9px 30px;
        margin: 0;
        text-align: left;
        left: 0;
        top: 0;
        border: 1px solid rgba(255, 255, 255, 0.94);
        border-radius: 9px;
        background: linear-gradient(
          132deg,
          rgba(255, 255, 255, 0.92),
          rgba(232, 240, 255, 0.72)
        );
        -webkit-backdrop-filter: blur(13px) saturate(1.2);
        backdrop-filter: blur(13px) saturate(1.2);
        box-shadow:
          0 14px 32px rgba(44, 70, 127, 0.15),
          inset 1px 1px 0 rgba(255, 255, 255, 0.92);
        transform-origin: 50% 4px;
        will-change: transform, left, top;
        pointer-events: auto;
        cursor: pointer;
        touch-action: pan-x pan-y;
        user-select: none;
      }
      .hanging-polaroid img {
        width: 100%;
        height: 100%;
        object-fit: contain;
        object-position: center;
        display: block;
        border-radius: 2px;
        pointer-events: none;
        background: rgba(233, 240, 252, 0.7);
      }
      .hanging-polaroid .polaroid-label {
        position: absolute;
        bottom: 8px;
        left: 9px;
        right: 9px;
        font-size: 10px;
        font-weight: 800;
        color: #7381a3;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
        pointer-events: none;
      }
      /* Clear acrylic clothespin attaches the photo to the sloping wire. */
      .hanging-polaroid .wire-clip {
        position: absolute;
        z-index: 4;
        top: -17px;
        left: 50%;
        width: 16px;
        height: 27px;
        transform: translateX(-50%);
        border: 1px solid rgba(178, 212, 255, 0.86);
        border-radius: 4px 4px 5px 5px;
        background: linear-gradient(
          90deg,
          rgba(255, 255, 255, 0.87),
          rgba(155, 197, 244, 0.52) 45%,
          rgba(225, 245, 255, 0.75)
        );
        box-shadow:
          1px 3px 8px rgba(85, 129, 190, 0.13),
          inset 1px 1px 0 white;
        pointer-events: none;
      }
      .hanging-polaroid .wire-clip::after {
        content: "";
        position: absolute;
        top: 7px;
        left: 7px;
        height: 18px;
        width: 1px;
        background: rgba(83, 127, 182, 0.33);
      }
      /* Faint empty memories, behind the active line */
      .rear-empty {
        position: absolute;
        width: clamp(116px, 10vw, 155px);
        aspect-ratio: 170/206;
        padding: 9px 9px 29px;
        left: 0;
        top: 0;
        border-radius: 9px;
        border: 1px solid rgba(205, 222, 245, 0.44);
        background: linear-gradient(
          145deg,
          rgba(255, 255, 255, 0.34),
          rgba(205, 225, 250, 0.18)
        );
        box-shadow: 0 12px 25px rgba(51, 88, 155, 0.07);
        pointer-events: none;
      }
      .rear-empty .rear-empty-photo {
        height: 100%;
        width: 100%;
        display: block;
        border-radius: 3px;
        background: linear-gradient(
          135deg,
          rgba(223, 235, 250, 0.36),
          rgba(178, 208, 251, 0.15)
        );
        border: 1px solid rgba(255, 255, 255, 0.28);
      }
      .rear-empty .wire-clip {
        position: absolute;
        top: -15px;
        left: calc(50% - 6px);
        width: 12px;
        height: 24px;
        border: 1px solid rgba(177, 207, 246, 0.5);
        border-radius: 3px;
        background: rgba(217, 234, 255, 0.38);
      }
      @media (max-width: 660px) {
        .hanging-polaroid {
          width: clamp(91px, 19vw, 126px);
          padding: 6px 6px 22px;
        }
        .hanging-polaroid .polaroid-label {
          font-size: 8px;
          bottom: 5px;
          left: 6px;
        }
        .rear-empty {
          width: clamp(87px, 17vw, 114px);
        }
      }
      /* archive bottom handle */
      #archive-tab {
        position: fixed;
        z-index: 25;
        bottom: 0;
        left: 50%;
        transform: translateX(-50%);
        min-width: min(400px, 80vw);
        padding: 21px 26px 17px;
        border: 1px solid rgba(255, 255, 255, 0.95);
        border-radius: 22px 22px 0 0;
        color: var(--blue);
        font-size: clamp(13px, 1.3vw, 20px);
        font-weight: 900;
        letter-spacing: 0.06em;
        white-space: nowrap;
        background: linear-gradient(
          125deg,
          rgba(255, 255, 255, 0.83),
          rgba(216, 227, 255, 0.53)
        );
        box-shadow: 0 -9px 25px rgba(47, 79, 148, 0.08);
        backdrop-filter: blur(20px);
      }
      #archive-tab::before {
        content: "";
        position: absolute;
        top: 10px;
        left: calc(50% - 23px);
        width: 46px;
        height: 4px;
        border-radius: 99px;
        background: #93a4ed;
      }
      body.archive-open #archive-tab {
        visibility: hidden;
      }
      /* ------------------------------------------------------------
   02. THE ARCHIVE — SOLID PAGE, TRANSLUCENT ALBUMS
   ------------------------------------------------------------ */
      #archive-sheet {
        position: fixed;
        inset: 0;
        z-index: 40;
        display: flex;
        flex-direction: column;
        height: 100dvh;
        overflow: hidden;
        transform: translateY(103%);
        transition: transform 0.62s cubic-bezier(0.2, 0.8, 0.18, 1);
        background:
          radial-gradient(
            ellipse at 10% 90%,
            rgba(97, 157, 248, 0.22),
            transparent 48%
          ),
          radial-gradient(
            ellipse at 89% 17%,
            rgba(165, 198, 247, 0.21),
            transparent 49%
          ),
          linear-gradient(120deg, #f6faff, #ecf3fb);
        border-radius: 0;
        box-shadow: 0 -25px 75px rgba(40, 69, 116, 0.15);
      }
      body.archive-open #archive-sheet {
        transform: translateY(0);
      }
      /* Decorative out-of-focus shapes BEHIND the album. These make acrylic translucency readable. */
      #archive-sheet::before {
        content: "";
        position: absolute;
        z-index: 0;
        inset: 10% 0 0;
        pointer-events: none;
        background:
          radial-gradient(
            ellipse 160px 250px at 17% 37%,
            rgba(99, 142, 255, 0.13),
            transparent 72%
          ),
          radial-gradient(
            ellipse 280px 220px at 75% 70%,
            rgba(143, 194, 243, 0.15),
            transparent 76%
          );
        filter: blur(23px);
      }
      #archive-sheet > * {
        position: relative;
        z-index: 1;
      }
      .archive-header {
        flex: 0 0 auto;
        background: rgba(255, 255, 255, 0.88);
        border-bottom: 1px solid var(--line);
        padding: 26px clamp(17px, 4vw, 70px) 12px;
        backdrop-filter: blur(22px);
      }
      .archive-grip {
        position: absolute;
        top: 9px;
        left: 50%;
        transform: translateX(-50%);
        border: 0;
        width: 60px;
        height: 5px;
        background: #b7c5e8;
        border-radius: 99px;
        padding: 0;
      }
      .archive-mini-bar {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 16px;
      }
      .archive-brand {
        font-size: 12px;
        font-weight: 900;
        letter-spacing: 0.16em;
        white-space: nowrap;
        color: #31466c;
      }
      .archive-tools {
        display: flex;
        align-items: center;
        gap: 8px;
        margin-left: auto;
        flex-wrap: wrap;
      }
      .archive-tools input {
        border: 1px solid #d4dfef;
        background: rgba(255, 255, 255, 0.95);
        color: var(--ink);
        border-radius: 9px;
        height: 39px;
        padding: 7px 10px;
        min-width: 0;
        font-size: 13px;
      }
      #archive-search {
        width: clamp(130px, 17vw, 250px);
      }
      #archive-date {
        width: clamp(128px, 13vw, 175px);
      }
      .archive-tools button,
      .archive-close {
        height: 39px;
        padding: 0 13px;
        font-weight: 800;
        color: #315cd4;
        border: 1px solid #d5e0f1;
        border-radius: 9px;
        background: #edf2ff;
        white-space: nowrap;
        font-size: 13px;
      }
      .archive-close {
        background: white;
        flex: 0 0 auto;
      }
      .archive-rail {
        flex: 1;
        display: flex;
        align-items: center;
        gap: clamp(44px, 6vw, 96px);
        min-height: 0;
        overflow-x: auto;
        overflow-y: hidden;
        padding: 40px clamp(28px, 7vw, 112px) 70px;
        scrollbar-width: none;
        scroll-snap-type: none;
        touch-action: pan-x pan-y;
        -webkit-overflow-scrolling: touch;
        perspective: 1400px;
      }
      .archive-rail::-webkit-scrollbar {
        display: none;
      }
      .archive-empty {
        margin: auto;
        font-size: 17px;
        color: #6d7b97;
      }
      /* Album shell = coloured translucent acrylic cover + layers of clear material */
      .album-card {
        --album-color: #b9ccef;
        --album-ink: #20345d;
        --album-angle: -3deg;
        position: relative;
        isolation: isolate;
        flex: 0 0 min(820px, 82vw);
        min-width: 0;
        padding: 12px 10px 28px;
        cursor: pointer;
        transform: rotate(var(--album-angle)) rotateX(2deg);
        transform-origin: center;
        transition: transform 0.25s ease;
        touch-action: pan-x pan-y;
      }
      .album-card:hover {
        transform: rotate(var(--album-angle)) rotateX(2deg) translateY(-3px);
      }
      .album-card::before {
        content: "";
        position: absolute;
        inset: 23px 7px 52px 8px;
        z-index: 0;
        border-radius: 9px 19px 19px 9px;
        pointer-events: none;
        background: linear-gradient(
          130deg,
          rgba(255, 255, 255, 0.64),
          var(--album-color) 95%
        );
        opacity: 0.72;
        box-shadow:
          6px 7px 0 rgba(225, 234, 247, 0.85),
          11px 12px 0 rgba(158, 181, 225, 0.25),
          21px 30px 44px rgba(51, 82, 141, 0.15);
      }
      .album-spread {
        position: relative;
        z-index: 1;
        display: grid;
        grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
        width: 100%;
        height: clamp(350px, 66dvh, 645px);
        padding: 8px;
        border: 7px solid transparent;
        border-image: none;
        border-radius: 9px 18px 18px 9px;
        background:
          linear-gradient(
              120deg,
              rgba(255, 255, 255, 0.83),
              rgba(184, 211, 253, 0.25),
              rgba(255, 255, 255, 0.76)
            )
            padding-box,
          linear-gradient(
              120deg,
              rgba(255, 255, 255, 0.93),
              var(--album-color),
              rgba(255, 255, 255, 0.91)
            )
            border-box;
        box-shadow:
          inset 0 1px 4px rgba(255, 255, 255, 0.95),
          inset 0 -6px 13px rgba(74, 114, 196, 0.08),
          0 3px 0 rgba(255, 255, 255, 0.93),
          0 8px 0 rgba(137, 157, 201, 0.14),
          18px 28px 43px rgba(44, 70, 124, 0.18);
        -webkit-backdrop-filter: blur(17px) saturate(1.25);
        backdrop-filter: blur(17px) saturate(1.25);
      }
      /* visible center spine and acrylic binding loops; not photo pins */
      .album-spread::before {
        content: "";
        pointer-events: none;
        position: absolute;
        z-index: 5;
        top: 3px;
        bottom: 3px;
        left: calc(50% - 14px);
        width: 28px;
        background: linear-gradient(
          90deg,
          rgba(71, 100, 157, 0.19),
          rgba(255, 255, 255, 0.75) 52%,
          rgba(48, 75, 134, 0.11)
        );
        filter: blur(2px);
      }
      .album-spread::after {
        content: "";
        pointer-events: none;
        position: absolute;
        z-index: 6;
        top: 7%;
        bottom: 7%;
        left: calc(50% - 19px);
        width: 38px;
        background:
          radial-gradient(
            ellipse 16px 26px at 50% 14%,
            transparent 54%,
            rgba(121, 145, 181, 0.45) 61%,
            rgba(252, 254, 255, 0.9) 66%,
            rgba(109, 138, 180, 0.34) 73%,
            transparent 77%
          ),
          radial-gradient(
            ellipse 16px 26px at 50% 50%,
            transparent 54%,
            rgba(121, 145, 181, 0.45) 61%,
            rgba(252, 254, 255, 0.9) 66%,
            rgba(109, 138, 180, 0.34) 73%,
            transparent 77%
          ),
          radial-gradient(
            ellipse 16px 26px at 50% 86%,
            transparent 54%,
            rgba(121, 145, 181, 0.45) 61%,
            rgba(252, 254, 255, 0.9) 66%,
            rgba(109, 138, 180, 0.34) 73%,
            transparent 77%
          );
      }
      .album-page {
        min-width: 0;
        min-height: 0;
        position: relative;
        padding: clamp(14px, 2vw, 29px);
        overflow-x: hidden;
        overflow-y: auto;
        scrollbar-width: none;
        color: #273754;
        background: linear-gradient(
          120deg,
          rgba(255, 255, 255, 0.77),
          rgba(244, 249, 255, 0.69)
        );
        box-shadow:
          inset 0 1px 1px rgba(255, 255, 255, 0.98),
          inset 0 0 23px rgba(105, 139, 212, 0.05);
        backdrop-filter: blur(13px);
      }
      .album-page:first-child {
        border-radius: 3px 0 0 3px;
        background: linear-gradient(
          95deg,
          rgba(255, 255, 255, 0.84),
          rgba(239, 247, 255, 0.74)
        );
      }
      .album-page:nth-child(2) {
        border-radius: 0 3px 3px 0;
        background: linear-gradient(
          95deg,
          rgba(231, 243, 255, 0.74),
          rgba(255, 255, 255, 0.82)
        );
      }
      .album-page::-webkit-scrollbar {
        display: none;
      }
      .page-date {
        margin: 0 0 17px;
        font-size: 12px;
        letter-spacing: 0.1em;
        font-weight: 900;
        color: #657694;
      }
      .album-grid {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: clamp(11px, 1.4vw, 20px);
        align-content: start;
        padding: 6px 4px 26px;
      }
      /* standardized acrylic polaroids: exact same aspect ratio regardless of source photo */
      .album-photo {
        position: relative;
        display: block;
        min-width: 0;
        width: 100%;
        height: auto;
        aspect-ratio: 170/206;
        padding: 8px 8px 26px;
        border-radius: 6px;
        border: 1px solid rgba(255, 255, 255, 0.95);
        background: linear-gradient(
          140deg,
          rgba(255, 255, 255, 0.85),
          rgba(237, 245, 255, 0.64)
        );
        box-shadow:
          inset 0 1px 2px rgba(255, 255, 255, 0.94),
          0 7px 17px rgba(39, 69, 125, 0.15);
        cursor: pointer;
        transform: rotate(var(--photo-angle, 0deg));
        transition:
          filter 0.18s,
          box-shadow 0.18s;
        touch-action: pan-x pan-y;
      }
      .album-photo:hover {
        filter: brightness(1.03);
        box-shadow: 0 13px 26px rgba(39, 69, 125, 0.19);
        z-index: 4;
      }
      .album-photo img {
        display: block;
        width: 100%;
        height: 100%;
        object-fit: contain;
        object-position: center;
        border-radius: 2px;
        background: #e4ecf9;
        pointer-events: none;
      }
      .album-photo::after {
        content: attr(data-date);
        position: absolute;
        left: 8px;
        bottom: 8px;
        font-size: 10px;
        font-weight: 800;
        color: #70809e;
        background: transparent;
        pointer-events: none;
      }
      /* No ::before pin, no thumbtack SVG/HTML anywhere. */
      .album-caption {
        margin: 23px 10px 0;
        color: #70819f;
        font-size: 11px;
        font-weight: 900;
        letter-spacing: 0.13em;
      }
      .page-empty {
        font-size: 12px;
        color: #9aa7bb;
      }
      /* Closed acrylic covers */
      .album-cover {
        display: none;
        flex-direction: column;
        justify-content: space-between;
        position: relative;
        z-index: 1;
        width: 100%;
        height: clamp(350px, 66dvh, 645px);
        padding: 9%;
        overflow: hidden;
        background: linear-gradient(
          125deg,
          rgba(255, 255, 255, 0.81),
          rgba(230, 242, 255, 0.33) 48%,
          var(--album-color)
        );
        color: var(--album-ink);
        border: 1px solid rgba(255, 255, 255, 0.91);
        border-left: 18px solid rgba(92, 117, 187, 0.36);
        border-radius: 8px 20px 20px 8px;
        box-shadow:
          inset 2px 2px 3px rgba(255, 255, 255, 0.94),
          inset -15px -20px 35px rgba(90, 132, 222, 0.09),
          8px 9px 0 rgba(255, 255, 255, 0.7),
          20px 30px 43px rgba(44, 70, 124, 0.2);
        -webkit-backdrop-filter: blur(24px) saturate(1.35);
        backdrop-filter: blur(24px) saturate(1.35);
      }
      .album-cover::after {
        content: "";
        position: absolute;
        right: -16%;
        top: -22%;
        width: 70%;
        aspect-ratio: 1;
        border-radius: 50%;
        pointer-events: none;
        background: radial-gradient(
          circle at 34% 30%,
          rgba(255, 255, 255, 0.91),
          rgba(196, 223, 255, 0.4) 40%,
          rgba(66, 115, 224, 0.17) 75%,
          transparent
        );
        filter: blur(7px);
      }
      .album-cover-mini {
        font-size: 12px;
        letter-spacing: 0.19em;
        font-weight: 900;
      }
      .album-cover-name {
        font-size: clamp(55px, 7vw, 100px);
        font-weight: 900;
        line-height: 0.84;
        letter-spacing: -0.085em;
      }
      .album-cover-period {
        font-size: 14px;
        letter-spacing: 0.06em;
        font-weight: 800;
      }
      .album-card.closed .album-spread {
        display: none;
      }
      .album-card.closed .album-cover {
        display: flex;
      }
      /* ------------------------------------------------------------
   03. EDIT DIALOG, REAL PHOTO (UNCROPPED), TEXT FORMATTING
   ------------------------------------------------------------ */
      .overlay {
        position: fixed;
        inset: 0;
        z-index: 80;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 18px;
        background: rgba(15, 25, 49, 0.38);
        backdrop-filter: blur(12px);
      }
      .dialog {
        width: min(690px, 95vw);
        max-height: min(calc(var(--visual-height) - 25px), 92dvh);
        overflow-y: auto;
        overscroll-behavior: contain;
        padding: 22px 25px 30px;
        border: 1px solid rgba(255, 255, 255, 0.95);
        border-radius: 20px;
        background: #fff;
        box-shadow: 0 30px 90px rgba(10, 27, 69, 0.3);
        touch-action: pan-y;
      }
      .dialog-head {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 14px;
      }
      .dialog-head h3 {
        margin: 0;
        font-size: clamp(19px, 2vw, 28px);
        letter-spacing: -0.03em;
      }
      .dialog-head button {
        border: 1px solid #dde5f5;
        border-radius: 9px;
        color: #385bd9;
        background: #f7faff;
        padding: 10px 13px;
        white-space: nowrap;
      }
      .dialog .sub {
        color: #8995ac;
        font-size: 12px;
        margin: 8px 0 20px;
      }
      .field {
        display: flex;
        flex-direction: column;
        gap: 8px;
        margin: 14px 0;
        color: #4d6082;
        font-size: 13px;
        font-weight: 750;
      }
      .field input:not([type="checkbox"]),
      .field textarea {
        width: 100%;
        min-height: 42px;
        padding: 12px 13px;
        border: 1px solid #dae3f2;
        border-radius: 10px;
        background: #f8faff;
        color: #23344e;
      }
      .edit-image {
        display: block;
        width: 100%;
        height: min(38dvh, 390px);
        max-height: 100%;
        object-fit: contain !important;
        object-position: center;
        background: #edf2fb;
        border-radius: 13px;
        cursor: zoom-in;
      }
      .rich-editor {
        width: 100%;
        min-height: 160px;
        padding: 16px 17px;
        border: 1px solid #dae3f2;
        border-radius: 12px;
        background: #fbfcff;
        color: #243756;
        font-size: 16px;
        line-height: 1.65;
        white-space: pre-wrap;
        overflow-wrap: anywhere;
        outline: none;
      }
      .rich-editor:empty::before {
        content: attr(data-placeholder);
        color: #a4afc2;
      }
      .rich-editor:focus {
        border-color: #8197f0;
      }
      .memo-task {
        display: flex;
        gap: 8px;
        align-items: flex-start;
        min-height: 24px;
        white-space: normal;
      }
      .memo-task input {
        flex: 0 0 auto;
        margin: 7px 0 0;
        width: 16px;
        height: 16px;
        accent-color: #5269ea;
      }
      .memo-task span {
        min-width: 0;
        flex: 1;
        outline: none;
        white-space: pre-wrap;
      }
      .format-tools {
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
        margin: 5px 0 12px;
      }
      .format-tools button {
        border: 1px solid #dbe4f0;
        background: #f7faff;
        color: #43557b;
        border-radius: 8px;
        padding: 7px 9px;
        min-height: 35px;
        font-size: 12px;
        font-weight: 800;
      }
      .format-tools button[data-color] {
        width: 28px;
        min-width: 28px;
        border-radius: 50%;
        padding: 4px;
        background: var(--tone);
        height: 28px;
        min-height: 28px;
        align-self: center;
      }
      .dialog-actions {
        display: flex;
        gap: 10px;
        justify-content: flex-end;
        flex-wrap: wrap;
        margin-top: 22px;
      }
      .dialog-actions button {
        border: 1px solid #d5e0f0;
        padding: 12px 16px;
        border-radius: 10px;
        background: #f4f7fc;
        color: #254069;
        font-weight: 800;
      }
      .dialog-actions .solid,
      .dialog-actions .danger {
        background: #4760e9;
        color: white;
        border-color: #4760e9;
      }
      .dialog-actions .danger {
        background: #dc4e5a;
        border-color: #dc4e5a;
      }
      .error {
        font-size: 12px;
        color: #d94f5b;
      }
      .date-combined {
        position: relative;
        display: flex;
        align-items: center;
        border: 1px solid #d6e1f2;
        border-radius: 9px;
        background: #f9fbff;
        min-height: 44px;
        overflow: hidden;
      }
      .date-display {
        position: absolute;
        left: 13px;
        top: 50%;
        transform: translateY(-50%);
        display: flex;
        letter-spacing: 0.035em;
        pointer-events: none;
        font-weight: 650;
        color: #263d63;
      }
      .date-display .ghost {
        color: #b0bbcc;
      }
      .masked-date {
        position: relative;
        width: calc(100% - 56px) !important;
        color: transparent !important;
        caret-color: #5366de;
        background: transparent !important;
        border: 0 !important;
        box-shadow: none !important;
        z-index: 1;
        letter-spacing: 0.035em;
        font-family: monospace;
      }
      .picker-wrap {
        position: relative;
        flex: 0 0 52px;
        text-align: center;
        display: grid;
        place-items: center;
        font-size: 23px;
        color: #506ce6;
        height: 44px;
      }
      .picker-wrap input[type="date"] {
        position: absolute;
        inset: 0;
        opacity: 0;
        width: 100% !important;
        height: 100%;
        cursor: pointer;
        z-index: 3;
      }
      /* =========================================================
   GLASS EDITOR — IMAGE FIRST UI (REFINED)
   ========================================================= */
      .editor-overlay {
        align-items: center;
        justify-content: center;
        padding: 20px;
        background: rgba(14, 20, 34, 0.26);
        backdrop-filter: blur(16px) saturate(1.04);
        -webkit-backdrop-filter: blur(16px) saturate(1.04);
        overflow: auto;
        overscroll-behavior: contain;
      }

      .editor-modal {
        position: relative;
        width: min(980px, 92vw);
        aspect-ratio: 15 / 8; /* 기존보다 세로를 줄임 */
        height: auto;
        min-height: 0;
        padding: 0;
        overflow: visible; /* 폴라로이드가 밖으로 튀어나오게 */
        border-radius: 28px;
        border: 1px solid rgba(255, 255, 255, 0.24);
        background: linear-gradient(
          145deg,
          rgba(255, 255, 255, 0.14),
          rgba(255, 255, 255, 0.06) 42%,
          rgba(214, 224, 246, 0.08) 100%
        );
        box-shadow:
          0 24px 80px rgba(18, 31, 62, 0.22),
          inset 0 1px 0 rgba(255, 255, 255, 0.32),
          inset 0 -1px 0 rgba(255, 255, 255, 0.06);
        backdrop-filter: blur(26px) saturate(1.08);
        -webkit-backdrop-filter: blur(26px) saturate(1.08);
        touch-action: none;
      }

      .editor-modal::before {
        content: "";
        position: absolute;
        inset: 0;
        pointer-events: none;
        background:
          radial-gradient(
            circle at 18% 16%,
            rgba(255, 255, 255, 0.24),
            transparent 24%
          ),
          radial-gradient(
            circle at 84% 12%,
            rgba(255, 255, 255, 0.1),
            transparent 22%
          );
      }

      .editor-close {
        position: absolute;
        top: 18px;
        right: 20px;
        z-index: 6;
        width: 46px;
        height: 46px;
        border: 1px solid rgba(255, 255, 255, 0.24);
        border-radius: 50%;
        background: rgba(255, 255, 255, 0.08);
        color: #33456c;
        font-size: 24px;
        font-weight: 700;
        cursor: pointer;
        backdrop-filter: blur(10px);
        box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.3);
      }

      .editor-shell {
        position: relative;
        z-index: 1;
        display: grid;
        grid-template-columns: 0.92fr 1.08fr;
        gap: 34px; /* 사진과 글 영역 간격 더 넓힘 */
        width: 100%;
        height: 100%;
        padding: 24px 28px 20px;
      }

      .editor-left {
        min-width: 0;
        min-height: 0;
        display: flex;
        align-items: center;
        justify-content: flex-start;
        overflow: visible;
      }

      .editor-image-stage {
        position: relative;
        width: 100%;
        height: 100%;
        min-height: 0;
        border: 0;
        background: transparent;
        box-shadow: none;
        overflow: visible; /* 폴라로이드 잘리지 않게 */
      }
      .editor-polaroid {
        position: absolute;
        left: -6px; /* 창 왼쪽 바깥으로 조금 튀어나오게 */
        top: 52%;
        width: min(96%, 520px);
        aspect-ratio: 168 / 208;
        transform: translateY(-54%) rotate(-7deg);
        padding: 14px 14px 58px;
        border-radius: 4px; /* 거의 직각 */
        border: 1px solid rgba(255, 255, 255, 0.82);
        background: linear-gradient(
          145deg,
          rgba(255, 255, 255, 0.88),
          rgba(241, 246, 255, 0.56)
        );
        box-shadow:
          0 18px 42px rgba(25, 42, 78, 0.2),
          inset 0 1px 0 rgba(255, 255, 255, 0.95);
        cursor: zoom-in;
        z-index: 3;
      }

      .editor-polaroid-media {
        position: relative;
        width: 100%;
        aspect-ratio: 4 / 3;
        overflow: visible;
        background: transparent;
      }

      .editor-polaroid-media img {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        object-fit: contain !important; /* 원본비율 최대한 유지 */
        object-position: center;
        pointer-events: none;
        filter: drop-shadow(0 10px 16px rgba(18, 28, 56, 0.1));
      }

      .editor-polaroid-date {
        margin-top: 18px;
        width: 100%;
        border: 0;
        outline: 0;
        background: transparent;
        color: rgba(56, 71, 104, 0.62);
        font-size: 14px;
        font-weight: 800;
        letter-spacing: 0.04em;
      }

      .editor-polaroid-title {
        width: 100%;
        margin-top: 4px;
        border: 0;
        outline: 0;
        background: transparent;
        color: rgba(46, 58, 84, 0.88);
        font-size: 28px;
        font-weight: 800;
        letter-spacing: -0.04em;
      }

      .editor-right {
        min-width: 0;
        min-height: 0;
        display: flex;
        flex-direction: column;
        padding-top: 10px;
        padding-left: 34px; /* 글 영역을 사진에서 더 멀리 */
        position: relative;
        z-index: 2;
      }

      .editor-topbar {
        display: flex;
        align-items: flex-start;
        justify-content: space-between;
        gap: 14px;
        margin-bottom: 8px;
        padding-right: 62px;
      }

      .editor-heading-wrap {
        min-width: 0;
      }

      .editor-kicker {
        margin: 0 0 4px;
        color: rgba(255, 255, 255, 0.52);
        font-size: 11px;
        font-weight: 800;
        letter-spacing: 0.16em;
      }

      .editor-heading {
        margin: 0;
        color: rgba(255, 255, 255, 0.92);
        font-size: 15px;
        font-weight: 700;
        letter-spacing: -0.01em;
      }

      .editor-actions {
        display: flex;
        align-items: center;
        gap: 10px;
        flex-shrink: 0;
      }

      .editor-btn {
        min-height: 42px;
        padding: 0 18px;
        border-radius: 999px;
        border: 1px solid rgba(255, 255, 255, 0.22);
        background: rgba(255, 255, 255, 0.1);
        color: #33456c;
        font-size: 15px;
        font-weight: 800;
        cursor: pointer;
        backdrop-filter: blur(10px);
        box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.28);
      }

      .editor-btn.primary {
        background: rgba(94, 110, 244, 0.88);
        border-color: rgba(94, 110, 244, 0.88);
        color: #fff;
        box-shadow: 0 10px 26px rgba(87, 102, 232, 0.24);
      }

      .editor-writing-panel {
        position: relative;
        flex: 1;
        min-height: 0;
        border: 0;
        background: transparent;
        box-shadow: none;
        overflow: visible;
        backdrop-filter: none;
      }

      .editor-writing-panel::before {
        content: none;
      }

      .editor-note-surface {
        position: relative;
        z-index: 1;
        width: 100%;
        height: 100%;
        min-height: 250px;
        padding: 18px 2px 8px 0;
        border: 0;
        outline: 0;
        background: transparent;
        color: rgba(255, 255, 255, 0.92); /* 글씨 흰색 계열 */
        font-size: 16px;
        line-height: 2.05;
        white-space: pre-wrap;
        overflow-wrap: anywhere;
        overflow-y: auto;
        overscroll-behavior: contain;
        -webkit-overflow-scrolling: touch;
        touch-action: manipulation;
        user-select: text;
        -webkit-user-select: text;
        box-shadow: none;
      }

      .editor-note-surface:empty::before {
        content: attr(data-placeholder);
        color: rgba(255, 255, 255, 0.42);
      }

      .editor-note-surface * {
        color: inherit;
      }

      @media (max-width: 980px) {
        .editor-modal {
          width: min(94vw, 94vw);
          aspect-ratio: auto;
          max-height: 82dvh;
        }

        .editor-shell {
          grid-template-columns: 1fr;
          gap: 12px;
          padding: 18px 18px 16px;
          overflow-y: auto;
        }

        .editor-left {
          min-height: 340px;
          overflow: visible;
        }

        .editor-image-stage {
          min-height: 320px;
        }

        .editor-polaroid {
          width: min(78vw, 430px);
          left: 6px;
          top: 50%;
          transform: translateY(-52%) rotate(-6deg);
        }

        .editor-topbar {
          padding-right: 56px;
          align-items: flex-start;
          flex-direction: column;
        }

        .editor-actions {
          width: 100%;
          justify-content: flex-end;
        }

        .editor-note-surface {
          min-height: 240px;
          padding-right: 2px;
          font-size: 15px;
          line-height: 1.95;
        }

        .editor-heading {
          font-size: 14px;
        }

        .editor-polaroid-title {
          font-size: 24px;
        }
      }
      /* ------------------------------------------------------------
   04. BULK SELECTION
   ------------------------------------------------------------ */
      #batch-bar {
        position: fixed;
        left: 50%;
        transform: translateX(-50%);
        bottom: 15px;
        z-index: 90;
        display: flex;
        align-items: center;
        gap: 9px;
        flex-wrap: wrap;
        justify-content: center;
        max-width: min(95vw, 960px);
        padding: 12px 15px;
        border: 1px solid #e0e6f2;
        border-radius: 16px;
        background: rgba(255, 255, 255, 0.96);
        box-shadow: 0 13px 38px rgba(26, 51, 99, 0.18);
        backdrop-filter: blur(15px);
      }
      #batch-bar strong {
        font-size: 13px;
        white-space: nowrap;
        margin-right: 10px;
      }
      #batch-bar button {
        padding: 9px 12px;
        border: 1px solid #d6dff0;
        border-radius: 9px;
        background: #f4f7ff;
        color: #2e4ab1;
        font-weight: 800;
      }
      #batch-bar .danger {
        background: #dd5264;
        color: white;
        border-color: #dd5264;
      }
      body.batch-mode .polaroid,
      body.batch-mode .album-photo {
        opacity: 0.48;
      }
      body.batch-mode .polaroid.selected,
      body.batch-mode .album-photo.selected {
        opacity: 1;
      }
      .selection-check {
        display: none;
        position: absolute;
        z-index: 12;
        left: 50%;
        top: 50%;
        transform: translate(-50%, -50%);
        width: 44px;
        height: 44px;
        border-radius: 50%;
        background: #4564e9;
        color: white;
        font-size: 25px;
        line-height: 44px;
        text-align: center;
        box-shadow: 0 5px 16px rgba(38, 64, 139, 0.27);
        pointer-events: none;
      }
      body.batch-mode .polaroid.selected .selection-check,
      body.batch-mode .album-photo.selected .selection-check {
        display: block;
      }
      /* ------------------------------------------------------------
   05. RESPONSIVE + REDUCED MOTION
   ------------------------------------------------------------ */
      @media (max-width: 1020px) {
        #cover-title {
          left: 5.5%;
          top: 29%;
          width: 60%;
        }
        #cover-title h1 {
          font-size: clamp(63px, 10vw, 116px);
        }
        #three-glass-scene {
