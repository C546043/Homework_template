<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" fill="none">
<defs>
 <linearGradient id="line" x1="0" y1="0" x2="1600" y2="500" gradientUnits="userSpaceOnUse"><stop stop-color="#8E9FF4" stop-opacity=".28"/><stop offset=".5" stop-color="#C2D4F9" stop-opacity=".4"/><stop offset="1" stop-color="#8E9FF4" stop-opacity=".28"/></linearGradient>
 <linearGradient id="paper" x1="0" y1="0" x2="180" y2="160" gradientUnits="userSpaceOnUse"><stop stop-color="#FFF" stop-opacity=".5"/><stop offset="1" stop-color="#B7CEF6" stop-opacity=".14"/></linearGradient>
 <radialGradient id="orb"><stop stop-color="#FFF" stop-opacity=".8"/><stop offset=".55" stop-color="#B5C9FB" stop-opacity=".24"/><stop offset="1" stop-color="#92A7F0" stop-opacity=".04"/></radialGradient>
 <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="12"/></filter>
</defs>
<!-- calm thin lines connect seamlessly between repeats -->
<path d="M0 190 C280 60 395 300 710 218 S1200 75 1600 190" stroke="url(#line)" stroke-width="2.8"/>
<path d="M0 640 C270 735 530 445 790 565 S1290 770 1600 640" stroke="#B8CBED" stroke-opacity=".32" stroke-width="2"/>
<path d="M0 320 C360 410 380 190 760 355 S1230 450 1600 320" stroke="#D6E3F6" stroke-opacity=".28" stroke-width="1.6"/>
<!-- pale empty photos on their own floating strings -->
<g transform="translate(120 245) rotate(-11)" opacity=".30">
 <rect x="-6" y="8" width="142" height="190" rx="4" fill="#7B95D0" opacity=".12" filter="url(#shadow)"/>
 <rect x="0" y="0" width="124" height="169" rx="5" fill="url(#paper)" stroke="#8AA4DB" stroke-width="2"/>
 <rect x="12" y="14" width="100" height="116" rx="2" fill="#D4E2F6" fill-opacity=".22" stroke="#ABC0E4" stroke-width="1"/>
 <rect x="53" y="-12" width="18" height="27" rx="5" fill="#E8F0FF" stroke="#92A9DD" stroke-width="1.7"/>
</g>
<g transform="translate(1195 440) rotate(10)" opacity=".31">
 <rect x="0" y="0" width="136" height="172" rx="5" fill="url(#paper)" stroke="#9DB5E4" stroke-width="2"/>
 <rect x="12" y="13" width="112" height="116" rx="2" fill="#D3E2F8" fill-opacity=".24" stroke="#B4C8EA"/>
 <rect x="59" y="-10" width="18" height="22" rx="4" fill="#E8EFFF" stroke="#94AFDE" stroke-width="1.7"/>
</g>
<g transform="translate(565 68) rotate(14)" opacity=".16">
 <rect x="0" y="0" width="90" height="120" rx="4" stroke="#91A8DA" stroke-width="2" fill="url(#paper)"/>
 <rect x="10" y="12" width="70" height="81" rx="2" fill="#DBE6F9" fill-opacity=".3" stroke="#B8C7E6"/>
</g>
<!-- airy books: tiny simple outlined open pages -->
<g transform="translate(415 690) rotate(-14)" opacity=".26" stroke="#8AA2DF" stroke-width="2" stroke-linejoin="round">
 <path d="M0 18 Q38 -3 76 18 L76 101 Q43 81 0 103 Z" fill="url(#paper)"/>
 <path d="M76 18 Q114 -3 152 18 L152 103 Q109 81 76 101 Z" fill="url(#paper)"/>
 <path d="M76 18 V101" stroke="#AABCE9"/>
 <path d="M9 28 Q40 16 68 30 M84 30 Q110 16 145 28" stroke="#C1CFF0" stroke-width="1.2"/>
</g>
<g transform="translate(1395 98) rotate(14)" opacity=".21" stroke="#8AA4DF" stroke-width="2">
 <path d="M0 14 Q33 -1 67 14 L67 88 Q34 73 0 91 Z" fill="#F8FAFF"/>
 <path d="M67 14 Q100 -1 134 14 L134 91 Q100 73 67 88 Z" fill="#EEF3FF"/>
</g>
<!-- soft marbles, no animation, no JS -->
<circle cx="915" cy="105" r="48" fill="url(#orb)"/>
<circle cx="940" cy="110" r="29" stroke="#8BA3E3" stroke-opacity=".23" stroke-width="2"/>
<circle cx="1510" cy="735" r="63" fill="url(#orb)"/>
<circle cx="1510" cy="735" r="37" stroke="#A8BDE7" stroke-opacity=".20" stroke-width="2"/>
<circle cx="260" cy="760" r="20" fill="url(#orb)"/>
<circle cx="790" cy="770" r="5" fill="#8EABF5" fill-opacity=".16"/>
<circle cx="1115" cy="225" r="4" fill="#7E9ADE" fill-opacity=".18"/>
</svg>