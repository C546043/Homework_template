<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>메모장 카메라</title>
    <!-- Firebase SDK (v8 콤팩트 버전 사용) -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
    <style>
      body {
        margin: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        height: 100vh;
        background-color: #1e1e1e;
        color: white;
        font-family: sans-serif;
      }
      .camera-btn {
        background-color: #4caf50;
        color: white;
        padding: 20px 40px;
        font-size: 1.5rem;
        border-radius: 50px;
        text-align: center;
        display: inline-block;
        box-shadow: 0 10px 20px rgba(0, 0, 0, 0.3);
        cursor: pointer;
      }
      input[type="file"] {
        display: none;
      }
      #status {
        margin-top: 20px;
        color: #aaa;
      }
    </style>
  </head>
  <body>
    <label class="camera-btn">
      📸 사물 찍기
      <input
        type="file"
        accept="image/*"
        capture="environment"
        id="camera-input"
      />
    </label>
    <p id="status">대기 중...</p>

    <script>
      // 방금 보신 Firebase 설정값 적용
      const firebaseConfig = {
        apiKey: "AIzaSyCr5rtPZ6u8eqlXvBoyjm3RAerOYYiL44",
        authDomain: "interactivememo.firebaseapp.com",
        databaseURL: "https://interactivememo-default-rtdb.firebaseio.com", // 본인 DB URL 확인 필요시 수정
        projectId: "interactivememo",
        storageBucket: "interactivememo.appspot.com",
        messagingSenderId: "244477022912",
        appId: "1:244477022912:web:7fa3461abc1c752e345325",
        measurementId: "G-KBN8K062ZR",
      };
      firebase.initializeApp(firebaseConfig);
      const db = firebase.database();

      const cameraInput = document.getElementById("camera-input");
      const statusText = document.getElementById("status");

      cameraInput.addEventListener("change", (e) => {
        const file = e.target.files[0];
        if (!file) return;

        statusText.innerText = "처리 중...";

        const reader = new FileReader();
        reader.onload = function (event) {
          const img = new Image();
          img.onload = function () {
            const canvas = document.createElement("canvas");
            const MAX_WIDTH = 500;
            // 원본이 500px보다 작을 때 이미지를 불필요하게 확대하지 않습니다.
            const scaleSize = Math.min(1, MAX_WIDTH / img.width);
            canvas.width = Math.round(img.width * scaleSize);
            canvas.height = Math.round(img.height * scaleSize);

            const ctx = canvas.getContext("2d");
            ctx.drawImage(img, 0, 0, canvas.width, canvas.height);

            const base64Data = canvas.toDataURL("image/jpeg", 0.8);

            db.ref("incoming")
              .push({
                image: base64Data,
                timestamp: Date.now(),
              })
              .then(() => {
                statusText.innerText = "전송 완료! PC 화면을 확인하세요.";
              })
              .catch((error) => {
                console.error("Firebase 전송 실패:", error);
                statusText.innerText = "전송에 실패했습니다. 인터넷 연결을 확인해 주세요.";
              });
          };
          img.src = event.target.result;
        };
        reader.readAsDataURL(file);
      });
    </script>
  </body>
</html>
