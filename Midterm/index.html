<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Capture to Memo!</title>

    <style>
      :root {
        --cream: #f8f4e8;
        --navy: #244665;
        --mint: #c4d8d3;
        --yellow: #fff5cb;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        overflow: hidden;
        color: var(--navy);
        font-family: Arial, "Malgun Gothic", sans-serif;
        background: var(--cream);
      }

      button,
      input,
      textarea {
        font: inherit;
      }

      button {
        cursor: pointer;
      }

      /* 두 화면을 옆으로 연결 */
      #viewport {
        width: 100vw;
        height: 100dvh;
        overflow: hidden;
      }

      #screen-track {
        display: flex;
        width: 200vw;
        height: 100%;
        transition: transform 0.65s cubic-bezier(0.22, 1, 0.36, 1);
      }

      #screen-track.show-locker {
        transform: translateX(-100vw);
      }

      .screen {
        width: 100vw;
        height: 100%;
        flex: 0 0 100vw;
        min-width: 0;
      }

      /* 사진 수신 화면 */
      #work-screen {
        display: flex;
        flex-direction: column;
        background: var(--cream);
        position: relative;
      }

      #work-header {
        flex: 0 0 94px;
        padding: 20px 100px 16px 30px;
        border-bottom: 2px solid #e8e0d0;
        display: flex;
        align-items: center;
        gap: 22px;
      }

      #app-title {
        background: white;
        border: 2px solid var(--navy);
        border-radius: 10px;
        padding: 15px 22px;
        font-size: 21px;
        font-weight: 900;
        white-space: nowrap;
      }

      #work-header p {
        color: #78818a;
        font-size: 14px;
      }

      #incoming-scroll {
        flex: 1;
        min-height: 0;
        overflow-y: auto;
        padding: 28px 100px 60px 40px;
      }

      #incoming-list {
        max-width: 1250px;
        margin: 0 auto;
      }

      #empty-message {
        padding: 100px 20px;
        text-align: center;
        font-size: 17px;
        color: #8a918b;
      }

      .hour-group {
        margin-bottom: 38px;
      }

      .hour-title {
        display: flex;
        align-items: center;
        gap: 14px;
        margin-bottom: 20px;
        font-size: 18px;
        font-weight: bold;
      }

      .hour-title::after {
        content: "";
        flex: 1;
        height: 1px;
        background: #d5d5cb;
      }

      .hour-count {
        color: #90958f;
        font-size: 13px;
        font-weight: normal;
      }

      .photo-grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(175px, 1fr));
        gap: 20px;
      }

      .incoming-photo {
        background: white;
        border: 1px solid #eee9dd;
        border-radius: 13px;
        padding: 12px;
        min-height: 195px;
        box-shadow: 0 5px 18px rgba(0, 0, 0, 0.045);
        cursor: pointer;
        transition:
          transform 0.18s,
          box-shadow 0.18s;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 10px;
      }

      .incoming-photo:hover {
        transform: translateY(-4px);
        box-shadow: 0 9px 22px rgba(0, 0, 0, 0.1);
      }

      .incoming-photo img {
        width: 100%;
        height: 180px;
        object-fit: contain;
        pointer-events: none;
      }

      .incoming-original-date {
        color: #637b79;
        background: #e7f0eb;
        border-radius: 7px;
        padding: 5px 7px;
        font-size: 11px;
        text-align: center;
        line-height: 1.4;
      }
      .incoming-photo time {
        color: #828987;
        font-size: 12px;
      }

      #open-locker-btn {
        position: absolute;
        right: 0;
        top: 50%;
        transform: translateY(-50%);
        width: 66px;
        height: 170px;
        background: var(--mint);
        border: 0;
        border-radius: 14px 0 0 14px;
        font-weight: 800;
        color: #315c59;
        writing-mode: vertical-rl;
        z-index: 5;
      }

      /* 보관함 전체 화면 */
      #locker-screen {
        display: flex;
        flex-direction: column;
        background: var(--mint);
        padding: 16px 22px 14px;
      }

      #locker-header {
        flex: 0 0 65px;
        display: flex;
        align-items: center;
        gap: 20px;
      }

      #locker-header h2 {
        margin: 0;
        font-size: 24px;
      }

      #locker-header small {
        color: #57716c;
      }

      #back-btn {
        border: 2px solid #779a92;
        border-radius: 9px;
        background: white;
        color: #315b58;
        padding: 10px 16px;
        font-weight: bold;
      }

      #locker {
        position: relative;
        flex: 1;
        min-height: 0;
        overflow: hidden;
        border: 3px dashed rgba(255, 255, 255, 0.85);
        background: rgba(255, 255, 255, 0.28);
        border-radius: 15px;
      }

      .saved-item {
        position: absolute;
        padding: 0;
        border: none;
        background: transparent;
        transform-origin: center center;
        cursor: grab;
        user-select: none;
        overflow: visible;
      }

      .saved-item img {
        display: block;
        width: 100%;
        height: 100%;
        object-fit: contain;
        pointer-events: none;
      }

      .locker-label {
        position: absolute;
        background: url("./라벨@3x.png") center / 100% 100% no-repeat;
        color: #25384a;
        font-weight: 800;
        font-size: 13px;
        display: flex;
        justify-content: center;
        align-items: center;
        padding: 2px 7px 2px 26px;
        pointer-events: none;
        transform-origin: center;
        white-space: nowrap;
      }

      .locker-label span {
        display: block;
        overflow: hidden;
        text-overflow: ellipsis;
      }

      /* 편집 모달 */
      #deco-modal {
        position: fixed;
        inset: 0;
        background: rgba(18, 27, 35, 0.6);
        z-index: 100;
        display: none;
        justify-content: center;
        align-items: center;
        padding: 16px;
      }

      #deco-modal.open {
        display: flex;
      }

      .modal-content {
        display: flex;
        gap: 24px;
        padding: 28px;
        background: white;
        border-radius: 16px;
        max-height: 95dvh;
        max-width: 96vw;
        overflow: auto;
        box-shadow: 0 16px 45px rgba(0, 0, 0, 0.2);
      }

      .modal-left {
        width: 460px;
        display: flex;
        flex-direction: column;
        gap: 14px;
      }

      #memo-input {
        padding: 13px;
        width: 100%;
        border: 1px solid #ccc;
        border-radius: 8px;
      }

      #popup-workspace-wrap {
        width: 460px;
        height: 390px;
        max-width: 100%;
        background: #f7f7f5;
        border: 1px solid #ddd;
        border-radius: 10px;
        display: flex;
        justify-content: center;
        align-items: center;
      }

      #popup-workspace {
        position: relative;
        width: 320px;
        height: 280px;
        touch-action: none;
      }

      #popup-preview-img {
        width: 100%;
        height: 100%;
        display: block;
        object-fit: contain;
        user-select: none;
        pointer-events: none;
      }

      .popup-sticker {
        width: 40px;
        height: 40px;
        position: absolute;
        cursor: grab;
        touch-action: none;
        z-index: 3;
      }

      .popup-sticker.rect {
        background: rgba(240, 99, 99, 0.85);
      }

      .popup-sticker.circle {
        background: rgba(251, 205, 61, 0.85);
        border-radius: 50%;
      }

      .popup-sticker.triangle {
        background: rgba(103, 138, 255, 0.85);
        clip-path: polygon(50% 0, 0 100%, 100% 100%);
      }

      .sticker-container {
        display: flex;
        justify-content: center;
        gap: 10px;
      }

      .sticker-btn {
        border: 1px solid #ddd;
        border-radius: 7px;
        background: #f4f4f4;
        padding: 11px;
      }

      #fix-btn {
        padding: 15px;
        border: 0;
        border-radius: 9px;
        background: #dea85f;
        color: white;
        font-weight: 800;
      }

      #fix-btn:disabled {
        opacity: 0.5;
        cursor: wait;
      }

      .modal-right {
        display: flex;
        flex-direction: column;
        width: 280px;
        gap: 12px;
      }

      #close-modal {
        align-self: flex-end;
        border: none;
        border-radius: 8px;
        padding: 10px 14px;
        background: #eee;
      }

      #long-memo-input {
        flex: 1;
        min-height: 280px;
        width: 100%;
        padding: 15px;
        resize: none;
        border: 1px solid #ddd;
        border-radius: 10px;
        background: #fafaf8;
      }

      #status-toast {
        position: fixed;
        left: 50%;
        bottom: 22px;
        transform: translateX(-50%);
        background: #283e4c;
        color: white;
        padding: 12px 20px;
        border-radius: 9px;
        z-index: 200;
        display: none;
      }

      @media (max-width: 800px) {
        #work-header {
          padding-left: 14px;
        }
        #work-header p {
          display: none;
        }
        #incoming-scroll {
          padding: 20px 75px 30px 16px;
        }
        .photo-grid {
          grid-template-columns: repeat(2, minmax(0, 1fr));
        }
        .modal-content {
          flex-direction: column;
        }
        .modal-left {
          width: 100%;
        }
        .modal-right {
          width: 100%;
        }
        #popup-workspace-wrap {
          width: 100%;
        }
        #long-memo-input {
          min-height: 130px;
        }
      }

      /* 시간별 보관함: 고정된 물리 공간 */

      #locker {
        flex: 1 1 auto;
        height: auto;
        min-height: 0;

        overflow-x: hidden;
        overflow-y: auto;
        overscroll-behavior: contain;

        padding: 22px;
        display: block;
      }

      #locker-screen {
        min-height: 0;
        overflow: hidden;
      }

      /* 시간별 구획 */
      .locker-hour-group {
        position: relative;
        width: 100%;
        margin-bottom: 35px;
      }

      .locker-hour-title {
        display: flex;
        align-items: center;
        gap: 12px;
        margin-bottom: 14px;

        color: #244665;
        font-size: 17px;
        font-weight: 800;
      }

      .locker-hour-count {
        font-size: 13px;
        color: #718580;
        font-weight: normal;
      }

      /* 각 시간대의 독립된 물리 공간 */
      .locker-hour-space {
        position: relative;
        width: 100%;
        height: 370px;

        overflow: hidden;
        contain: layout paint;
        isolation: isolate;

        border: 2px dashed rgba(255, 255, 255, 0.9);
        border-radius: 14px;
        background: rgba(255, 255, 255, 0.22);
      }

      /* 사진의 움직임이 스크롤 높이에 영향을 주지 않도록 */
      .locker-hour-space .saved-item {
        position: absolute;
        margin: 0;
        padding: 0;
      }

      /* =========================
   보관함: 일별 카드형 레이아웃
   ========================= */

      #locker-screen {
        overflow: hidden;
      }

      #locker {
        flex: 1 1 auto;
        min-height: 0;
        overflow-y: auto;
        overflow-x: hidden;

        padding: 8px 6px 18px;
        border: none;
        background: transparent;
        border-radius: 0;
      }

      .locker-day-group {
        margin-bottom: 28px;
      }

      .locker-day-title {
        display: flex;
        align-items: center;
        gap: 10px;
        margin: 0 0 12px;
        padding: 0 4px;

        color: #244665;
        font-size: 15px;
        font-weight: 800;
      }

      .locker-day-count {
        font-size: 12px;
        font-weight: 600;
        color: #7a8b88;
      }

      .locker-grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(122px, 1fr));
        gap: 14px;
      }

      .locker-card {
        background: rgba(255, 255, 255, 0.96);
        border: 1px solid rgba(36, 70, 101, 0.08);
        border-radius: 14px;
        padding: 8px;

        box-shadow: 0 5px 14px rgba(0, 0, 0, 0.05);
        cursor: grab;
        user-select: none;

        transition:
          transform 0.15s ease,
          box-shadow 0.15s ease,
          opacity 0.15s ease;
      }

      .locker-card:hover {
        transform: translateY(-2px);
        box-shadow: 0 10px 20px rgba(0, 0, 0, 0.08);
      }

      .locker-card.dragging {
        opacity: 0.55;
      }

      .locker-card-thumb-wrap {
        width: 100%;
        aspect-ratio: 1 / 1;
        border-radius: 10px;
        overflow: hidden;
        background: #eef2f0;
      }

      .locker-card img {
        width: 100%;
        height: 100%;
        display: block;
        object-fit: cover;
      }

      .locker-card-meta {
        padding-top: 8px;
      }

      .locker-card-title {
        font-size: 13px;
        font-weight: 700;
        line-height: 1.3;
        color: #244665;
        word-break: keep-all;

        min-height: 32px;
        overflow: hidden;
        display: -webkit-box;
        -webkit-line-clamp: 2;
        -webkit-box-orient: vertical;
      }

      .locker-card-time {
        margin-top: 4px;
        font-size: 11px;
        color: #7b8786;
      }

      #locker-empty-message {
        padding: 70px 10px;
        text-align: center;
        font-size: 15px;
        color: #7a8a86;
      }

      /* =========================================
   날짜별 보관함 + 오늘의 메모
========================================= */

      /* 좌측 보관함과 우측 추억 패널 */
      #locker-content {
        display: flex;
        flex: 1 1 auto;
        min-height: 0;
        min-width: 0;
        gap: 20px;
        overflow: hidden;
      }

      /* 기존 날짜별 보관함 */
      #locker-content #locker {
        flex: 1 1 0;
        min-width: 0;
        min-height: 0;
        height: auto;
        max-height: none;
        overflow-y: auto;
        overflow-x: hidden;
      }

      /* 오른쪽 패널 */
      #daily-memory-panel {
        width: 325px;
        flex: 0 0 325px;
        min-height: 0;

        display: flex;
        flex-direction: column;

        padding: 24px 22px;
        background: #fffdf6;
        border: 1px solid #e8e2d2;
        border-radius: 18px;
        box-shadow: 0 5px 22px rgba(0, 0, 0, 0.045);
        overflow: hidden;
      }

      .daily-memory-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
      }

      .daily-memory-eyebrow {
        color: #b69c70;
        font-size: 10px;
        font-weight: 800;
        letter-spacing: 1.6px;
      }

      .daily-memory-header h3 {
        margin: 8px 0 0;
        font-size: 22px;
        color: #244665;
      }

      .daily-memory-description {
        margin: 12px 0 20px;
        font-size: 13px;
        color: #84918c;
      }

      /* 실제 메모가 표시되는 공간 */
      #daily-memory-content {
        flex: 1 1 auto;
        min-height: 0;
        overflow-y: auto;
      }

      .daily-memory-photo {
        display: block;
        width: 100%;
        max-height: 250px;
        object-fit: contain;

        background: #f0f2eb;
        border-radius: 12px;
        cursor: pointer;
      }

      .daily-memory-title {
        margin: 18px 0 8px;
        font-size: 19px;
        font-weight: 800;
        color: #244665;
        overflow-wrap: anywhere;
      }

      .daily-memory-date {
        margin-bottom: 18px;
        color: #989e96;
        font-size: 12px;
      }

      /* 상세 메모 */
      .daily-memory-body {
        padding: 15px;
        border-radius: 11px;
        background: #f6f4ea;

        font-size: 14px;
        line-height: 1.75;
        color: #46565d;

        white-space: pre-wrap;
        overflow-wrap: anywhere;
      }

      .daily-memory-empty {
        padding: 35px 10px;
        text-align: center;
        color: #9b9f97;
        font-size: 14px;
        line-height: 1.8;
      }

      /* 다른 추억 보기 */
      #daily-memory-shuffle {
        flex: 0 0 auto;
        width: 100%;
        margin-top: 18px;
        padding: 13px;

        border: 1px solid #d9c39e;
        border-radius: 10px;
        background: #fff5d5;

        font-size: 13px;
        font-weight: 800;
        color: #6e5a37;

        transition: background 0.2s;
      }

      #daily-memory-shuffle:hover {
        background: #f9e6b6;
      }

      #daily-memory-shuffle:disabled {
        opacity: 0.45;
        cursor: not-allowed;
      }

      /* 창이 좁아지는 경우 */
      @media (max-width: 850px) {
        #locker-content {
          flex-direction: column;
          overflow-y: auto;
        }

        #locker-content #locker {
          flex: 0 0 auto;
          min-height: 260px;
          overflow: visible;
        }

        #daily-memory-panel {
          flex: 0 0 auto;
          width: 100%;
          min-height: 320px;
          overflow: visible;
        }

        #daily-memory-content {
          overflow: visible;
        }
      }

      /* 태블릿/터치 UI 및 메인 촬영 버튼 */
      #photo-actions {
        display: flex;
        gap: 10px;
        align-items: center;
        margin-left: auto;
      }
      #photo-actions input[type="file"] {
        position: absolute;
        width: 1px;
        height: 1px;
        opacity: 0;
        overflow: hidden;
      }
      .photo-action {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        min-height: 48px;
        padding: 10px 16px;
        border-radius: 10px;
        background: #fff;
        border: 2px solid #244665;
        color: #244665;
        font-size: 14px;
        font-weight: 800;
        white-space: nowrap;
        cursor: pointer;
        touch-action: manipulation;
      }
      .photo-action-primary {
        background: #244665;
        color: white;
      }
      .photo-action:active {
        transform: scale(0.98);
      }
      .incoming-photo,
      .locker-card,
      .daily-memory-photo {
        touch-action: pan-y;
      }
      button,
      .sticker-btn,
      #back-btn,
      #open-locker-btn {
        touch-action: manipulation;
      }
      @media (max-width: 1050px) {
        #work-header {
          height: auto;
          min-height: 94px;
          flex-wrap: wrap;
          padding: 12px 84px 12px 16px;
          gap: 10px;
        }
        #work-header p {
          display: none;
        }
        #photo-actions {
          margin-left: 0;
        }
        #incoming-scroll {
          padding: 20px 74px 30px 18px;
        }
        .modal-content {
          max-width: 96vw;
          padding: 18px;
          gap: 14px;
        }
        .modal-left {
          width: min(54vw, 460px);
          min-width: 0;
        }
        .modal-right {
          width: min(32vw, 280px);
          min-width: 0;
        }
        #popup-workspace-wrap {
          width: 100%;
        }
        #locker-content {
          gap: 12px;
        }
        #daily-memory-panel {
          width: 270px;
          flex-basis: 270px;
          padding: 16px;
        }
      }
      @media (max-width: 680px) {
        #work-header {
          padding-right: 16px;
        }
        #app-title {
          font-size: 18px;
          padding: 10px;
        }
        #photo-actions {
          width: 100%;
        }
        .photo-action {
          flex: 1;
          font-size: 12px;
          padding: 9px;
        }
        #open-locker-btn {
          width: 48px;
        }
        .modal-content {
          flex-direction: column;
          width: 100%;
        }
        .modal-left,
        .modal-right {
          width: 100%;
        }
        #popup-workspace-wrap {
          height: min(38vh, 320px);
        }
        #long-memo-input {
          min-height: 100px;
        }
      }

      /* 최종 세로형 사진과 메모 편집기 */
      #deco-modal {
        position: fixed;
        inset: 0;
        top: var(--visible-top, 0px);
        height: var(--visible-height, 100dvh);
        bottom: auto;
        display: none;
        justify-content: center;
        align-items: center;
        padding: 10px;
        overflow: hidden;
      }
      #deco-modal.open {
        display: flex;
      }
      #deco-modal .modal-content {
        display: flex;
        flex-direction: column;
        gap: 14px;
        width: min(760px, 98vw);
        max-width: 98vw;
        max-height: calc(var(--visible-height, 100dvh) - 20px);
        padding: 18px;
        overflow-y: auto;
        overflow-x: hidden;
        overscroll-behavior: contain;
        -webkit-overflow-scrolling: touch;
      }
      .memo-editor-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 10px;
      }
      .memo-editor-header h2 {
        color: #244665;
        font-size: 20px;
        margin: 0;
      }
      #deco-modal #close-modal {
        align-self: auto;
      }
      #deco-modal #memo-input {
        flex: none;
        min-height: 48px;
        width: 100%;
      }
      #deco-modal #popup-workspace-wrap {
        width: 100%;
        max-width: 100%;
        height: clamp(180px, 39vh, 420px);
        flex: none;
        overflow: hidden;
        padding: 0;
      }
      #deco-modal #popup-workspace {
        width: 100%;
        height: 100%;
        position: relative;
        cursor: zoom-in;
      }
      #deco-modal #popup-preview-img {

  <body>
    <div id="viewport">
      <div id="screen-track">
        <!-- 메인 사진 수신 화면 -->
        <section id="work-screen" class="screen">

                class="photo-action photo-action-primary"
                for="main-camera-input"

              </label>

                id="main-camera-input"
                type="file"
                accept="image/*"
                capture="environment"
              />
              <label class="photo-action" for="main-gallery-input">

              <input id="main-gallery-input" type="file" accept="image/*" />

          </header>

          <main id="incoming-scroll">
            <div id="incoming-list"></div>
            <div id="empty-message">아직 도착한 사진이 없어요.</div>
          </main>

          <button id="open-locker-btn">보관함 열기 ❯</button>
        </section>

        <!-- 보관함 화면 -->
        <section id="locker-screen" class="screen">
          <!-- 보관함 상단 -->
          <header id="locker-header">
            <!-- 작업대로 돌아가기 버튼: 원래 위치 -->
            <button type="button" id="back-btn" aria-label="작업대로 돌아가기">
              ❮ 작업대로
            </button>

            <h2>나의 보관함</h2>

            <small> 사진 터치 또는 더블클릭으로 수정할 수 있어요. </small>

            <!-- 검색 및 날짜 선택 -->
            <div id="locker-search-tools">
              <input
                id="locker-search"
                type="search"
                placeholder="메모 검색"
                aria-label="메모 검색"
              />

              <input id="locker-date" type="date" aria-label="날짜로 검색" />

              <button id="locker-filter-reset" type="button">초기화</button>
            </div>
          </header>

          <!-- 보관함 본문 -->
          <div id="locker-content">
            <!-- 날짜별 사진 및 메모 목록 -->
            <div id="locker"></div>

            <!-- 오른쪽: 오늘의 메모 -->
            <aside id="daily-memory-panel">
              <div class="daily-memory-header">
                <div>
                  <span class="daily-memory-eyebrow"> MEMORY OF THE DAY </span>

                  <h3>✨ 오늘의 메모</h3>
                </div>
              </div>

              <p class="daily-memory-description">
                잊고 있던 순간을 다시 만나보세요.
              </p>

              <!-- 랜덤 추억 표시 영역 -->
              <div id="daily-memory-content">
                <p class="daily-memory-empty">지난 추억을 찾고 있어요...</p>
              </div>

              <!-- 다른 추억 보기 -->
              <button
                id="daily-memory-shuffle"
                type="button"
                onclick="showRandomMemory(true)"
              >
                ↻ 다른 추억 보기
              </button>
            </aside>
          </div>
        </section>
      </div>
    </div>

    <!-- 세로형 사진/메모 편집기 -->
    <div
      id="deco-modal"
      role="dialog"
      aria-modal="true"
      aria-label="사진과 메모 기록"
    >
      <div class="modal-content">
        <div class="memo-editor-header">
          <h2>사진과 메모 기록</h2>
          <button id="close-modal" type="button" onclick="closeDecoModal()">
            ✕ 닫기
          </button>
        </div>
        <input
          id="memo-input"
          type="text"
          maxlength="40"
          placeholder="제목을 입력해주세요"
        />
        <div id="popup-workspace-wrap">
          <div id="popup-workspace">
            <img
              id="popup-preview-img"
              alt="메모에 저장할 사진"
              draggable="false"
            />
          </div>
        </div>
        <section class="memo-writing-section">
          <h3>상세 메모</h3>
          <div id="memo-toolbar" aria-label="글씨 서식 도구">
            <button type="button" class="format-btn" data-command="bold">
              <strong>B</strong>
            </button>
            <div id="memo-size-buttons">
              <button type="button" class="memo-size-btn" data-size="32">
                매우 크게
              </button>
              <button type="button" class="memo-size-btn" data-size="24">
                크게
              </button>
              <button type="button" class="memo-size-btn" data-size="16">
                중간
              </button>
              <button type="button" class="memo-size-btn" data-size="12">
                작게
              </button>
            </div>
            <div class="memo-color-group">
              <button
                type="button"
                class="memo-color"
                data-color="#e74d4d"
                style="--swatch: #e74d4d"
                aria-label="빨강"
              ></button>
              <button
                type="button"
                class="memo-color"
                data-color="#f09537"
                style="--swatch: #f09537"
                aria-label="주황"
              ></button>
              <button
                type="button"
                class="memo-color"
                data-color="#368a54"
                style="--swatch: #368a54"
                aria-label="초록"
              ></button>
              <button
                type="button"
                class="memo-color"
                data-color="#3977db"
                style="--swatch: #3977db"
                aria-label="파랑"
              ></button>
              <button
                type="button"
                class="memo-color"
                data-color="#9254ce"
                style="--swatch: #9254ce"
                aria-label="보라"
              ></button>
            </div>
            <button
              type="button"
              class="format-btn"
              data-command="insertUnorderedList"
            >
              • 목록
            </button>
            <button
              type="button"
              class="format-btn"
              data-command="insertOrderedList"
            >
              1. 목록
            </button>
            <button type="button" class="format-btn" id="memo-add-checkbox">
              ☐ 체크
            </button>
          </div>
          <div
            id="long-memo-input"
            contenteditable="true"
            role="textbox"
            aria-multiline="true"
            aria-label="상세 메모"
            data-placeholder="사진에 대한 이야기를 자유롭게 적어보세요..."
          ></div>
        </section>
        <button id="fix-btn" type="button" onclick="fixAndMerge()">
          보관함에 저장
        </button>
      </div>
    </div>
    <!-- 사진 전체화면 보기 -->
    <div id="photo-viewer" aria-hidden="true">
      <button
        id="photo-viewer-close"
        type="button"
        aria-label="사진 닫기"
        onclick="closePhotoViewer()"
      >
        ✕
      </button>
      <div id="photo-viewer-stage">
        <img id="photo-viewer-image" alt="확대된 사진" draggable="false" />
      </div>
    </div>

    <div id="status-toast"></div>

    <!-- Firebase -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

    <script>
      const firebaseConfig = {
        apiKey: "AIzaSyCr5rtPZ6u8eqlXvBoyjm3RAerOYYiL44",
        authDomain: "interactivememo.firebaseapp.com",
        databaseURL: "https://interactivememo-default-rtdb.firebaseio.com",
        projectId: "interactivememo",
        storageBucket: "interactivememo.appspot.com",
        messagingSenderId: "244477022912",
        appId: "1:244477022912:web:7fa3461abc1c752e345325",
        measurementId: "G-KBN8K062ZR",
      };

      if (!firebase.apps.length) {
        firebase.initializeApp(firebaseConfig);
      }

      window.db = firebase.database();
    </script>

    <!-- 사진 원본의 EXIF 촬영 날짜 읽기 -->

    <script src="https://cdn.jsdelivr.net/npm/exifr@7.1.3/dist/full.umd.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/dompurify@3.2.6/dist/purify.min.js"></script>
    <script src="sketch.js"></script>

    <!-- 촬영 날짜 자동 인식 실패 시 표시 -->

    <!-- 사진 날짜 지정 팝업 -->
    <div id="photo-date-modal" class="photo-date-modal" hidden>
      <div
        class="photo-date-dialog"
        role="dialog"
        aria-modal="true"
        aria-labelledby="photo-date-message"
      >
        <p id="photo-date-message">
          언제 생성된 사진인지 확인 할 수 없어요. 저장할 날짜를 입력해주세요!
        </p>

        <!-- 날짜: 숫자 직접 수정 + 달력 아이콘 -->
        <label for="photo-date-text">날짜</label>

        <div class="photo-date-combined">
          <!-- 회색 안내 문자와 실제 숫자를 표시 -->
          <div id="photo-date-display" aria-hidden="true"></div>

          <!-- 숫자 입력용: 숫자가 없는 곳은 Y/M/D 유지 -->
          <input
            type="text"
            id="photo-date-text"
            value="YYYY-MM-DD"
            inputmode="numeric"
            autocomplete="off"
            spellcheck="false"
            aria-label="날짜 입력, 년 네 자리 월 두 자리 일 두 자리"
          />

          <!-- 실제 달력 입력창: 아이콘 영역을 직접 터치 -->
          <div class="photo-date-calendar-area">
            <svg
              viewBox="0 0 24 24"
              width="22"
              height="22"
              fill="none"
              stroke="currentColor"
              stroke-width="1.8"
              stroke-linecap="round"
              stroke-linejoin="round"
              aria-hidden="true"
            >
              <rect x="3" y="5" width="18" height="16" rx="2" />
              <path d="M7 3v4M17 3v4M3 10h18" />
            </svg>

            <input
              type="date"
              id="photo-date-calendar"
              aria-label="달력에서 날짜 선택"
            />
          </div>
        </div>

        <label for="photo-date-time">시간</label>
        <input type="time" id="photo-date-time" step="60" />

        <p id="photo-date-error" role="alert" hidden></p>

        <div class="photo-date-actions">
          <button type="button" id="photo-date-cancel">취소</button>
          <button type="button" id="photo-date-confirm">이 날짜로 저장</button>
        </div>
      </div>
    </div>
  </body>
</html>
